$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: faqItem
name: FAQ Item
icon: screen
parameters:
  - id: question
    name: Question
    type: text
    guidance: >-
      The FAQ question (e.g., 'How long is the expedition?', 'What should I
      bring?')
    localizable: true
