# yaml-language-server: $schema=https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: contactCard
name: Contact Card
icon: screen
parameters:
  - id: image
    name: Image
    type: asset
    guidance: 'Team member photo (recommended: 200x200px, square ratio)'
    typeConfig:
      allowedTypes:
        - image
  - id: name
    name: Name
    type: text
    guidance: Team member's full name
    localizable: true
  - id: role
    name: Role
    type: text
    guidance: >-
      Team member's role or title (e.g., 'Lead Expedition Guide', 'Customer
      Success Manager')
    localizable: true
  - id: bio
    name: Bio
    type: text
    guidance: Short bio or description (2-3 sentences)
    localizable: true
description: >-
  A card displaying team member information with photo, name, role, and bio.
  Used for contact person showcase.
useTeamPermissions: true
slots: []
titleParameter: name
thumbnailParameter: image
canBeComposition: false
created: '2025-11-27T15:27:31.070838+00:00'
updated: '2025-11-27T15:27:31.070838+00:00'
